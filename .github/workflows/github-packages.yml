name: GitHub Packages

# Publishes a release to the npm registry of GitHub Packages once npm has
# it. publish.yml calls this after its npm job; a dispatch on main with a
# tag publishes a release that npm already carries, such as one tagged
# before this workflow existed.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag that npm already carries, such as v0.7.0"
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: publish to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          # Full history so the tagged commit can be checked against origin/main.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: https://npm.pkg.github.com
          scope: "@pwguler"

      - name: Tag matches package.json and is on main
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$pkg" ]; then
            echo "::error::tag $TAG does not match package.json version $pkg"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is not on origin/main; refusing to publish an unmerged commit"
            exit 1
          fi

      # The npm job just published a tag that arrives through the call, and
      # npm's reads can lag its writes by minutes, so only a dispatch asks.
      - name: A dispatched release is on npm
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          spec="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"
          if ! npm view "$spec" version --@pwguler:registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "::error::$spec is not on npm; GitHub Packages carries only releases that npm has"
            exit 1
          fi

      - name: Publish unless GitHub Packages has the version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          spec="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "::notice::$spec is already on GitHub Packages; nothing to do"
            exit 0
          fi
          npm publish
